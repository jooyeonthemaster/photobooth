<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3600" viewBox="0 0 2400 3600">
  <defs>
    <!-- Background Grid Pattern (light) -->
    <pattern id="grid-w" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="none" />
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#e0e0e5" stroke-width="2" />
    </pattern>

    <!-- Accent Gradients -->
    <linearGradient id="neonGradient-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0090a0" />
      <stop offset="100%" stop-color="#2070c0" />
    </linearGradient>

    <linearGradient id="borderGradient-w" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d0003a" />
      <stop offset="100%" stop-color="#ff8060" />
    </linearGradient>

    <!-- Subtle Text Shadow Filter -->
    <filter id="glow-w">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cutout Mask for exact photo placement -->
    <mask id="cutout-mask-w">
      <rect width="2400" height="3600" fill="white" />
      <rect x="150" y="200" width="1000" height="1350" rx="30" fill="black" />
      <rect x="1250" y="200" width="1000" height="1350" rx="30" fill="black" />
      <rect x="150" y="1650" width="1000" height="1350" rx="30" fill="black" />
      <rect x="1250" y="1650" width="1000" height="1350" rx="30" fill="black" />
    </mask>
  </defs>

  <!-- Solid Light Background -->
  <rect width="2400" height="3600" fill="#f5f5f8" />

  <!-- Grid Overlay -->
  <rect width="2400" height="3600" fill="url(#grid-w)" />

  <!-- Abstract Tech Decorations in the Background -->
  <circle cx="1200" cy="1800" r="1000" fill="none" stroke="#0090a0" stroke-width="1" stroke-opacity="0.12" />
  <circle cx="1200" cy="1800" r="1400" fill="none" stroke="#d0003a" stroke-width="1" stroke-opacity="0.06" />

  <!-- Master mask covering everything except the exact photo cutouts -->
  <g mask="url(#cutout-mask-w)">
    <rect width="2400" height="3600" fill="transparent" />
  </g>

  <!-- "Scanner" Edge Brackets -->
  <path d="M 80 150 L 80 80 L 150 80" fill="none" stroke="#222222" stroke-width="15" />
  <path d="M 2320 150 L 2320 80 L 2250 80" fill="none" stroke="#222222" stroke-width="15" />
  <path d="M 80 3450 L 80 3520 L 150 3520" fill="none" stroke="#222222" stroke-width="15" />
  <path d="M 2320 3450 L 2320 3520 L 2250 3520" fill="none" stroke="#222222" stroke-width="15" />

  <!-- UI Data Elements / Cyber Accents -->
  <g font-family="monospace" font-size="28" fill="#b0b0b8" font-weight="bold">
    <text x="150" y="150">SYS.INIT.2026 // D-SEC</text>
    <text x="2250" y="150" text-anchor="end">SCAN: NEANDER_LAB_01</text>
    <text x="100" y="1750" transform="rotate(-90 100 1750)">PROCESSING_AI_MODULES</text>
    <text x="2300" y="1500" transform="rotate(90 2300 1500)">AI_IMAGE_GENERATION</text>
  </g>

  <!-- Typography / Branding Area (Bottom) -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="1200" y="3250" font-size="130" font-weight="900" letter-spacing="35" fill="#1a1a1a" filter="url(#glow-w)">NEANDER LAB</text>

    <text id="dynamicSubtitle" x="1200" y="3400" font-family="'Arial Black', Arial, sans-serif" font-size="65" font-weight="bold" letter-spacing="10" fill="#0090a0">{{CUSTOM_TEXT}} // {{CURRENT_DATE}}</text>

    <rect x="1050" y="3080" width="300" height="10" fill="url(#neonGradient-w)" rx="5" />

    <circle cx="1150" cy="3470" r="8" fill="#d0003a" />
    <circle cx="1200" cy="3470" r="8" fill="#d0003a" />
    <circle cx="1250" cy="3470" r="8" fill="#0090a0" />
  </g>
</svg>