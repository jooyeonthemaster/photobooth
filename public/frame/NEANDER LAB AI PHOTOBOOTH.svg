<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3600" viewBox="0 0 2400 3600">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="none" />
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#2c2c35" stroke-width="2" />
    </pattern>

    <!-- Neon Cyan & Magenta Gradients for Accents -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="borderGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <!-- Glowing Text Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cutout Mask for exact photo placement -->
    <mask id="cutout-mask">
      <rect width="2400" height="3600" fill="white" />
      <!-- Top Left: 150, 200 -->
      <rect x="150" y="200" width="1000" height="1350" rx="30" fill="black" />
      <!-- Top Right: 1250, 200 -->
      <rect x="1250" y="200" width="1000" height="1350" rx="30" fill="black" />
      <!-- Bottom Left: 150, 1650 -->
      <rect x="150" y="1650" width="1000" height="1350" rx="30" fill="black" />
      <!-- Bottom Right: 1250, 1650 -->
      <rect x="1250" y="1650" width="1000" height="1350" rx="30" fill="black" />
    </mask>
  </defs>

  <!-- Solid Dark Background -->
  <rect width="2400" height="3600" fill="#13131a" />
  
  <!-- Grid Overlay -->
  <rect width="2400" height="3600" fill="url(#grid)" />

  <!-- Abstract Tech Decorations in the Background -->
  <circle cx="1200" cy="1800" r="1000" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.2" />
  <circle cx="1200" cy="1800" r="1400" fill="none" stroke="#ff0844" stroke-width="1" stroke-opacity="0.1" />

  <!-- Master mask covering everything except the exact photo cutouts -->
  <g mask="url(#cutout-mask)">
    <rect width="2400" height="3600" fill="transparent" />
  </g>

  <!-- Photo Area Frames -->
  <!-- We put these after the mask so they frame the cutouts. Removed strokes as per user request. -->
  <g fill="none" stroke-width="0" rx="30">
    <!-- Removed rect elements with stroke -->
  </g>

  <!-- "Scanner" Edge Brackets on the corners of the page -->
  <path d="M 80 150 L 80 80 L 150 80" fill="none" stroke="#ffffff" stroke-width="15" />
  <path d="M 2320 150 L 2320 80 L 2250 80" fill="none" stroke="#ffffff" stroke-width="15" />
  <path d="M 80 3450 L 80 3520 L 150 3520" fill="none" stroke="#ffffff" stroke-width="15" />
  <path d="M 2320 3450 L 2320 3520 L 2250 3520" fill="none" stroke="#ffffff" stroke-width="15" />

  <!-- UI Data Elements / Cyber Accents -->
  <g font-family="monospace" font-size="28" fill="#5e5e6e" font-weight="bold">
    <!-- Top left tech text -->
    <text x="150" y="150">SYS.INIT.2026 // D-SEC</text>
    <!-- Top right tech text -->
    <text x="2250" y="150" text-anchor="end">SCAN: NEANDER_LAB_01</text>
    <!-- Middle left vertical text -->
    <text x="100" y="1750" transform="rotate(-90 100 1750)">PROCESSING_AI_MODULES</text>
    <!-- Middle right vertical text -->
    <text x="2300" y="1500" transform="rotate(90 2300 1500)">AI_IMAGE_GENERATION</text>
  </g>

  <!-- Typography / Branding Area (Bottom) -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <!-- Glowing Main Text -->
    <text x="1200" y="3250" font-size="130" font-weight="900" letter-spacing="35" fill="#ffffff" filter="url(#glow)">NEANDER LAB</text>
    
    <!-- Subtitle (Dynamic placeholders replaced by the backend) -->
    <text id="dynamicSubtitle" x="1200" y="3400" font-family="'Arial Black', Arial, sans-serif" font-size="65" font-weight="bold" letter-spacing="10" fill="#00f2fe">{{CUSTOM_TEXT}} // {{CURRENT_DATE}}</text>
    
    <!-- Decorative Center Line -->
    <rect x="1050" y="3080" width="300" height="10" fill="url(#neonGradient)" rx="5" />
    
    <!-- Tech dots below -->
    <circle cx="1150" cy="3470" r="8" fill="#ff0844" />
    <circle cx="1200" cy="3470" r="8" fill="#ff0844" />
    <circle cx="1250" cy="3470" r="8" fill="#00f2fe" />
  </g>
</svg>